"The three Pokemon the player picks on the console, in the same order." = "本体で選んだ3匹のポケモンを同じ順序で指定します。"
"The three Pokemon you and your partner pick, in the same order, here and on the console." = "あなたと相手が選ぶ3匹を、ここでも本体でも同じ順序にしてください。"
"The trainers who fill the slots no console holds: two with one console joining, one with two, none with three. A slot you leave unpicked gets a trainer the game draws." = "空き枠を埋めるトレーナーです。本体1台なら2人、2台なら1人、3台なら不要です。未選択の枠はゲームが抽選します。"
"The Union Circle's four-digit Link Code." = "ユニオンサークルの4桁のあいことばです。"
"The wild Pokemon that appears around you in the game, to battle and catch." = "プレイヤー周辺に出現させ、バトル・捕獲できる野生ポケモンです。"
"The wireless channel of the network pokeldn hosts." = "pokeldnが開催するネットワークの無線チャンネルです。"
"Third move" = "技3"
