"Ending soonest" = "終了が近い順"
"Find mine" = "自分の情報を取得"
"No FireRed or LeafGreen trainer read yet. Trade with your game, or open Mystery Gift with it, then press Find mine again." = "ファイアレッド・リーフグリーンのトレーナー情報はまだ取得していません。ゲームと交換するか、ふしぎなおくりもので接続してから、もう一度「自分の情報を取得」を押してください。"
"No Switch trainer read yet. Do one trade with your game, offering a Pokemon you caught yourself, then press Find mine again." = "Switchのトレーナー情報はまだ取得していません。自分で捕まえたポケモンを提示して1回交換してから、もう一度「自分の情報を取得」を押してください。"
"The original trainer of every Pokemon the app builds for you. Put your own name, gender and IDs to make them yours, so a traded Pokemon keeps its friendship: FireRed and LeafGreen show a five-digit ID, the Switch games a six-digit one. The IDs were drawn at random on first launch; Find mine takes the ones of the last game you traded with." = "アプリで作成するポケモンの親情報です。自分の名前・性別・IDを設定すると自分のポケモンになり、交換後もなかよし度を維持できます。ファイアレッド・リーフグリーンは5桁、Switchのゲームは6桁のIDです。初回起動時のIDはランダムに生成されています。「自分の情報を取得」で、最後に交換したゲームの情報を反映できます。"
