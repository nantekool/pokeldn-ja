"Dynamax Adventure (LAN Join)" = "ダイマックスアドベンチャー（LANで参加）"
"Host a Dynamax Adventure a console in LAN mode joins over your own network, no board." = "同じネットワーク内で、LANモードのゲーム機が参加できるダイマックスアドベンチャーを募集します。ボードは不要です。"
"Host a Max Raid a console in LAN mode joins over your own network, no board." = "同じネットワーク内で、LANモードのゲーム機が参加できるマックスレイドバトルを募集します。ボードは不要です。"
"Host a trade a console in LAN mode joins over your own network, no board." = "同じネットワーク内で、LANモードのゲーム機が参加できる交換を募集します。ボードは不要です。"
"In Options, press L, R and the Left Stick together: the game turns LAN mode on." = "「設定」でL・R・左スティック押し込みを同時に操作すると、LANモードが有効になります。"
"Join a Dynamax Adventure a console in LAN mode hosts, over your own network, no board." = "同じネットワーク内で、LANモードのゲーム機が募集するダイマックスアドベンチャーに参加します。ボードは不要です。"
"Join a Max Raid a console in LAN mode hosts from a den, over your own network, no board." = "同じネットワーク内で、LANモードのゲーム機が巣穴から募集するマックスレイドバトルに参加します。ボードは不要です。"
"Max Raid (LAN Host)" = "マックスレイドバトル（LANで募集）"
"Max Raid (LAN Join)" = "マックスレイドバトル（LANで参加）"
"Pick a species; PKHeX builds a legal one for this game. Empty trades a random legal Pokemon." = "種類を選ぶとPKHeXがこのゲームで正規範囲内となる個体を作成します。空欄なら正規範囲内のポケモンをランダムに交換します。"
"Start the host; the console and this computer share one network." = "募集を開始してください。ゲーム機とこのパソコンを同じネットワークに接続しておきます。"
"Start the joiner while the console searches; the console and this computer share one network." = "ゲーム機が検索している間に参加を開始してください。ゲーム機とこのパソコンを同じネットワークに接続しておきます。"
"Trade (LAN Host)" = "交換（LANで募集）"
"Trade (LAN Join)" = "交換（LANで参加）"
"Trade with a console in LAN mode over your own network, no board." = "同じネットワーク内で、LANモードのゲーム機と交換します。ボードは不要です。"
"Y-Comm, Link Trade, with or without a Link Code (in LAN mode the code is ignored); press A on both messages." = "YY通信で「通信交換」を選んでください。パスワードの有無は問いません（LANモードでは無視されます）。2つの確認メッセージで、それぞれAを押してください。"
"Y-Comm: press X to refresh, choose POKELDN's raid, then Join and Start Battle." = "YY通信でXを押して更新し、POKELDNのレイドを選んで参加してから、バトルを開始してください。"
"PKHeX built no legal Pokemon to offer; pick one." = "PKHeXで交換に出せる正規範囲内のポケモンを作成できませんでした。ポケモンを選んでください。"
"No board needed: this computer's network" = "ボード不要：このパソコンのネットワークを使用"
"Random offer" = "ランダムに選ぶ"
"The cartridge's language: a Japanese cartridge lists POKELDN only when Japanese is chosen. The game's own addresses are read from the cartridge once it joins." = "カートリッジの言語です。日本語版では「日本語」を選んだ場合にのみ、リストにPOKELDNが表示されます。ゲーム固有のアドレスは、参加後にカートリッジから読み取ります。"
"Same as Settings" = "設定と同じ"
"Other players can still offer on it. The lister's app trades the first offer that answers it, the next time it is open; if that is not yours, yours comes back to the bank." = "ほかのプレイヤーも引き続き交換を申し込めます。募集者が次にアプリを開いたときに、条件に合う最初の申し込みと交換します。自分の申し込みが選ばれなかった場合、ポケモンはバンクに戻ります。"
"You offered; waiting for the lister." = "交換を申し込みました。募集者を待っています。"
"Your offer" = "自分の申し込み"
"Title screen: Mystery Gift, Wonder Cards, Friend. Emerald lists Mystery Gift once the player has the Pokedex and has written LINK TOGETHER WITH ALL on the Poke Mart questionnaire." = "タイトル画面→「ふしぎなおくりもの」（Mystery Gift）→「ふしぎなカード」（Wonder Cards）→「ともだち」（Friend）。原文の英語版エメラルドの手順では、ポケモン図鑑を入手し、フレンドリィショップのアンケートに LINK TOGETHER WITH ALL と入力すると利用できます。"
